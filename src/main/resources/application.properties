spring.application.name=billtracker

# Log incoming HTTP requests
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

# DATABASE CONNECTION
spring.datasource.url=jdbc:mysql://localhost:3306/bill_tracker
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}

# OPTIONAL: Set the MySQL driver explicitly (usually inferred)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE SETTINGS
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# PORT (optional override)
server.port=8080

# Disable default Spring Security login form temporarily
#spring.security.user.name=admin
#spring.security.user.password=admin
